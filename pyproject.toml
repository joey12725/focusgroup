[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "focusgroup"
dynamic = ["version"]
description = "Synthetic customer interviews from your terminal: generate a crowd of LLM personas, interview them in parallel, get a verdict."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Hersh" }]
requires-python = ">=3.10"
keywords = ["llm", "personas", "customer-discovery", "user-research", "cli", "openrouter", "mom-test"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
focusgroup = "focusgroup.cli:app"

[project.urls]
Repository = "https://github.com/joey12725/focusgroup"

[tool.hatch.version]
path = "focusgroup/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["focusgroup", "tests", "examples", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option defaults in signatures are the idiomatic Typer style

[tool.ruff.lint.per-file-ignores]
"focusgroup/cli.py" = ["UP007", "UP045"]  # Typer needs Optional[...] on older Pythons

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
