; Copy to focusgroup.ini in the directory you run focusgroup from.
; Every setting can also come from an environment variable (see docs/configuration.md).

[provider]
; Any OpenAI-compatible chat completions endpoint.
base_url = https://openrouter.ai/api/v1

; Name of the environment variable that holds the key. Keep the key itself in .env.
api_key_env = OPENROUTER_API_KEY

; Interview pool. Each interview draws one model at random, so a panel mixes
; several models and no single model's personality dominates the results.
; The first model also writes blueprints and personas.
models = openai/gpt-5-mini, anthropic/claude-haiku-4.5, google/gemini-2.5-flash, deepseek/deepseek-chat-v3-0324

; Optional: a stronger model just for the final report.
analyst_model = anthropic/claude-sonnet-4.5

; Max simultaneous requests.
concurrency = 8
